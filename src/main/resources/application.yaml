spring:
  application:
    name: aulaapi
  datasource:
    url: jdbc:mysql://localhost:3306/db-name?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: user
    password: pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
